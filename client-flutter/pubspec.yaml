name: ludo_rush
description: Ludo Rush - competitive mobile Ludo game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  http: ^1.2.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/home_ludo_background.png
    - assets/images/home_ludo_backdrop.png
    - assets/images/home_ludo_board_window.png
