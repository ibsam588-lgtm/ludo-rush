plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Read keystore properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Read Flutter version info from local.properties (written by `flutter build`)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'
def playTargetApi = 36
def minimumSupportedBillingMajor = 8

android {
    namespace "com.ludorush.game"
    // Hardcode SDK levels - flutter.compileSdkVersion / flutter.targetSdkVersion
    // can resolve to stale/wrong values depending on plugin evaluation order.
    compileSdk playTargetApi
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.ludorush.game"
        minSdkVersion flutter.minSdkVersion
        targetSdk playTargetApi
        versionCode Integer.parseInt(flutterVersionCode)
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias    System.getenv("KEY_ALIAS")    ?: keystoreProperties['keyAlias']
            keyPassword System.getenv("KEY_PASSWORD") ?: keystoreProperties['keyPassword']
            storeFile   System.getenv("KEYSTORE_PATH") != null
                            ? file(System.getenv("KEYSTORE_PATH"))
                            : (keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null)
            storePassword System.getenv("STORE_PASSWORD") ?: keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}

def verifyPlayCompliance = tasks.register("verifyPlayCompliance") {
    doLast {
        if (playTargetApi < 36) {
            throw new GradleException(
                "Google Play releases must target Android API 36 or higher."
            )
        }

        def billingVersions = configurations.releaseRuntimeClasspath
            .incoming
            .resolutionResult
            .allComponents
            .collect { component -> component.moduleVersion }
            .findAll { module ->
                module != null && module.group == "com.android.billingclient"
            }
            .collect { module -> module.version }
            .unique()

        billingVersions.each { version ->
            def major = version.tokenize('.').first()
            if (!(major ==~ /\d+/) || major.toInteger() < minimumSupportedBillingMajor) {
                throw new GradleException(
                    "Unsupported Google Play Billing Library ${version}; version 8 or newer is required."
                )
            }
        }

        logger.lifecycle(
            billingVersions.isEmpty()
                ? "Play compliance verified: target API ${playTargetApi}; Billing Library not packaged."
                : "Play compliance verified: target API ${playTargetApi}; Billing Library ${billingVersions.join(', ')}."
        )
    }
}

tasks.matching { task -> task.name == "preReleaseBuild" }.configureEach {
    dependsOn verifyPlayCompliance
}
