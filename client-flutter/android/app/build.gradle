plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Read keystore properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Read Flutter version info from local.properties (written by `flutter build`)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'
def playTargetApi = 36
def minimumSupportedBillingMajor = 8
def propOrEnv = { String propName, String envName, String fallback = '' ->
    def propValue = project.findProperty(propName)?.toString()
    if (propValue != null && propValue.trim()) return propValue
    def envValue = System.getenv(envName)
    if (envValue != null && envValue.trim()) return envValue
    return fallback
}
def admobApplicationId = propOrEnv(
        'ADMOB_APPLICATION_ID',
        'ADMOB_APPLICATION_ID',
        'ca-app-pub-3940256099942544~3347511713'
)
def requestedReleaseBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}
if (requestedReleaseBuild &&
        admobApplicationId == 'ca-app-pub-3940256099942544~3347511713') {
    throw new GradleException(
            'Set ADMOB_APPLICATION_ID for release builds. The default value is Google test-only metadata.'
    )
}

android {
    namespace "com.ludorush.game"
    // Hardcode SDK levels - flutter.compileSdkVersion / flutter.targetSdkVersion
    // can resolve to stale/wrong values depending on plugin evaluation order.
    compileSdk playTargetApi
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.ludorush.game"
        minSdkVersion flutter.minSdkVersion
        targetSdk playTargetApi
        versionCode Integer.parseInt(flutterVersionCode)
        versionName flutterVersionName
        manifestPlaceholders += [admobApplicationId: admobApplicationId]
    }

    signingConfigs {
        release {
            keyAlias    System.getenv("KEY_ALIAS")    ?: keystoreProperties['keyAlias']
            keyPassword System.getenv("KEY_PASSWORD") ?: keystoreProperties['keyPassword']
            storeFile   System.getenv("KEYSTORE_PATH") != null
                            ? file(System.getenv("KEYSTORE_PATH"))
                            : (keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null)
            storePassword System.getenv("STORE_PASSWORD") ?: keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'
    implementation 'com.google.android.gms:play-services-appset:16.1.0'

    // Unity LevelPlay mediated networks. Adapter/SDK pairs follow Unity's
    // Android network guides and are configured in the LevelPlay dashboard.
    implementation 'com.unity3d.ads-mediation:admob-adapter:5.11.0'
    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.2.1'
    implementation 'com.unity3d.ads-mediation:facebook-adapter:5.1.0'
    implementation 'com.facebook.android:audience-network-sdk:6.21.0'
    implementation 'com.unity3d.ads-mediation:unityads-adapter:5.5.0'
    implementation 'com.unity3d.ads:unity-ads:4.16.6'
    implementation 'com.unity3d.ads-mediation:applovin-adapter:5.2.0'
    implementation 'com.applovin:applovin-sdk:13.5.1'
    implementation 'com.unity3d.ads-mediation:vungle-adapter:5.5.0'
    implementation 'com.vungle:vungle-ads:7.7.0'
    implementation 'com.unity3d.ads-mediation:mintegral-adapter:5.7.0'
    implementation 'com.mbridge.msdk.oversea:mbridge_android_sdk:17.0.71'
    implementation 'com.unity3d.ads-mediation:pangle-adapter:5.10.0'
    implementation 'com.pangle.global:pag-sdk:7.9.0.9'
    implementation 'com.unity3d.ads-mediation:inmobi-adapter:5.4.0'
    implementation 'com.inmobi.monetization:inmobi-ads-kotlin:11.1.1'
    implementation 'com.unity3d.ads-mediation:fyber-adapter:5.3.0'
    implementation 'com.fyber:marketplace-sdk:8.4.2'
    implementation 'com.unity3d.ads-mediation:chartboost-adapter:5.4.0'
    implementation 'com.chartboost:chartboost-sdk:9.11.1'
}

def verifyPlayCompliance = tasks.register("verifyPlayCompliance") {
    doLast {
        if (playTargetApi < 36) {
            throw new GradleException(
                "Google Play releases must target Android API 36 or higher."
            )
        }

        def billingVersions = configurations.releaseRuntimeClasspath
            .incoming
            .resolutionResult
            .allComponents
            .collect { component -> component.moduleVersion }
            .findAll { module ->
                module != null && module.group == "com.android.billingclient"
            }
            .collect { module -> module.version }
            .unique()

        billingVersions.each { version ->
            def major = version.tokenize('.').first()
            if (!(major ==~ /\d+/) || major.toInteger() < minimumSupportedBillingMajor) {
                throw new GradleException(
                    "Unsupported Google Play Billing Library ${version}; version 8 or newer is required."
                )
            }
        }

        logger.lifecycle(
            billingVersions.isEmpty()
                ? "Play compliance verified: target API ${playTargetApi}; Billing Library not packaged."
                : "Play compliance verified: target API ${playTargetApi}; Billing Library ${billingVersions.join(', ')}."
        )
    }
}

tasks.matching { task -> task.name == "preReleaseBuild" }.configureEach {
    dependsOn verifyPlayCompliance
}
