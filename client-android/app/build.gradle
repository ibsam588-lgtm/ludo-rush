plugins {
    id "com.android.application"
}

android {
    namespace "com.ludorush.game"
    compileSdk 36

    defaultConfig {
        applicationId System.getenv("ANDROID_PACKAGE_NAME") ?: "com.ludorush.game"
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "6")
        versionName System.getenv("APP_VERSION") ?: "0.3.0"

        // AdMob unit IDs are injected at build time — never hardcoded in Java/source.
        // Resolution order for each ID: environment variable → local.properties → Google test ID.
        //   • CI/release builds set ADMOB_* env vars (see android-native-internal.yml).
        //   • Local dev can put the same keys in local.properties (gitignored):
        //       ADMOB_APP_ID=ca-app-pub-XXXXXXXXXXXXXXXX~XXXXXXXXXX
        //       ADMOB_BANNER_ID=ca-app-pub-XXXXXXXXXXXXXXXX/XXXXXXXXXX
        //       ADMOB_INTERSTITIAL_ID=ca-app-pub-XXXXXXXXXXXXXXXX/XXXXXXXXXX
        //       ADMOB_REWARDED_ID=ca-app-pub-XXXXXXXXXXXXXXXX/XXXXXXXXXX
        //   • The fallbacks below are Google's official test unit IDs (safe for debug).
        def localProps = new Properties()
        def localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }

        def adId = { String key, String fallback ->
            System.getenv(key) ?: localProps.getProperty(key, fallback)
        }

        manifestPlaceholders = [
            admobAppId: adId("ADMOB_APP_ID", "ca-app-pub-3940256099942544~3347511713")
        ]
        buildConfigField "String", "ADMOB_BANNER_ID",
            "\"${adId("ADMOB_BANNER_ID", "ca-app-pub-3940256099942544/6300978111")}\""
        buildConfigField "String", "ADMOB_REWARDED_ID",
            "\"${adId("ADMOB_REWARDED_ID", "ca-app-pub-3940256099942544/5224354917")}\""
        buildConfigField "String", "ADMOB_INTERSTITIAL_ID",
            "\"${adId("ADMOB_INTERSTITIAL_ID", "ca-app-pub-3940256099942544/1033173712")}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("ANDROID_KEYSTORE_FILE") ?: "upload.keystore")
            storePassword System.getenv("ANDROID_KEYSTORE_PASS") ?: ""
            keyAlias System.getenv("ANDROID_KEYALIAS_NAME") ?: "ludo_rush_upload"
            keyPassword System.getenv("ANDROID_KEYALIAS_PASS") ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.android.gms:play-services-ads:24.8.0"
}
