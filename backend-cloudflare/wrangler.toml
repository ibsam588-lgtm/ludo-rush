name = "ludo-rush-backend"
main = "src/index.ts"
compatibility_date = "2026-06-07"

[[durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LudoRoom"]

[[d1_databases]]
binding = "DB"
database_name = "ludo-rush-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[[queues.producers]]
binding = "BACKGROUND_QUEUE"
queue = "ludo-rush-background"

[[queues.consumers]]
queue = "ludo-rush-background"
max_batch_size = 10
max_batch_timeout = 30
