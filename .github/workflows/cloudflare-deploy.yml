name: Deploy Backend To Cloudflare

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply remote D1 migrations before deploy"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches: [main]
    paths:
      - "backend-cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply remote D1 migrations
        if: github.event_name == 'push' || inputs.apply_migrations == 'true'
        run: npx wrangler d1 migrations apply ludo-rush-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend-cloudflare
          command: deploy
