name: Unity Android Internal Build

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Deployed Cloudflare Worker URL"
        required: true
        default: "https://ludo-rush-backend.ibsam588.workers.dev"
      package_name:
        description: "Android package name"
        required: true
        default: "com.ludorush.game"
      upload_to_play:
        description: "Upload AAB to Google Play internal track"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  actions: read

concurrency:
  group: unity-android-internal
  cancel-in-progress: false

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: client-unity/Library
          key: Library-client-unity-Android-${{ hashFiles('client-unity/Packages/manifest.json') }}
          restore-keys: |
            Library-client-unity-Android-

      - name: Build Android App Bundle
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          LUDO_RUSH_BACKEND_URL: ${{ inputs.backend_url }}
          ANDROID_PACKAGE_NAME: ${{ inputs.package_name }}
          UNITY_ANDROID_KEYSTORE_BASE64: ${{ secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
          UNITY_ANDROID_KEYSTORE_PASS: ${{ secrets.UNITY_ANDROID_KEYSTORE_PASS }}
          UNITY_ANDROID_KEYALIAS_NAME: ${{ secrets.UNITY_ANDROID_KEYALIAS_NAME }}
          UNITY_ANDROID_KEYALIAS_PASS: ${{ secrets.UNITY_ANDROID_KEYALIAS_PASS }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ -z "${UNITY_LICENSE:-}" ]; then
            echo "UNITY_LICENSE secret is required" >&2
            exit 1
          fi

          printf '%s' "$UNITY_LICENSE" > "$RUNNER_TEMP/Unity_lic.ulf"

          docker run --rm \
            --workdir /github/workspace/client-unity \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --volume "$RUNNER_TEMP:/unity-license:ro" \
            --env LUDO_RUSH_BACKEND_URL \
            --env ANDROID_PACKAGE_NAME \
            --env ANDROID_VERSION_CODE \
            --env UNITY_ANDROID_KEYSTORE_BASE64 \
            --env UNITY_ANDROID_KEYSTORE_PASS \
            --env UNITY_ANDROID_KEYALIAS_NAME \
            --env UNITY_ANDROID_KEYALIAS_PASS \
            unityci/editor:6000.1.0f1-android-3 \
            bash -lc 'mkdir -p /root/.local/share/unity3d/Unity && cp /unity-license/Unity_lic.ulf /root/.local/share/unity3d/Unity/Unity_lic.ulf && unity-editor -batchmode -nographics -quit -projectPath /github/workspace/client-unity -executeMethod LudoRush.Editor.CiBuild.BuildAndroidAppBundle -logFile -'

      - name: Locate AAB
        id: locate
        shell: bash
        run: |
          AAB_PATH="$(find build -name '*.aab' -print -quit)"
          if [ -z "$AAB_PATH" ]; then
            echo "No AAB was produced" >&2
            exit 1
          fi
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoRush-Android-AAB
          path: ${{ steps.locate.outputs.aab_path }}

      - name: Setup Ruby
        if: inputs.upload_to_play == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Upload to Google Play internal track
        if: inputs.upload_to_play == 'true'
        run: bundle exec fastlane android internal aab_path:"${{ steps.locate.outputs.aab_path }}"
        env:
          ANDROID_PACKAGE_NAME: ${{ inputs.package_name }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
