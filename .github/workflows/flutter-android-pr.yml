name: Flutter Android — Pull Request

on:
  pull_request:
    paths:
      - 'client-flutter/**'
      - '.github/workflows/flutter-android-pr.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub
      - name: Create temporary CI signing key
        run: >-
          keytool -genkeypair -keystore "$RUNNER_TEMP/pr-signing.jks"
          -storepass android -keypass android -alias pr-signing
          -keyalg RSA -keysize 2048 -validity 1
          -dname "CN=CI,O=Ludo Rush,C=US"
      - name: Compile release Android app and native Play Games bridge
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pr-signing.jks
          KEY_ALIAS: pr-signing
          KEY_PASSWORD: android
          STORE_PASSWORD: android
        run: flutter build apk --release
      - name: Check WorkManager startup database survives R8
        run: |
          unzip -q build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' -d "$RUNNER_TEMP/release-dex"
          grep -a -l 'WorkDatabase_Impl' "$RUNNER_TEMP"/release-dex/classes*.dex
      - name: Enable KVM for release launch test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch minified release on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            adb install "$GITHUB_WORKSPACE/client-flutter/build/app/outputs/flutter-apk/app-release.apk"
            adb logcat -c
            adb shell am start -n com.ludorush.game/.MainActivity
            sleep 15
            adb shell pidof com.ludorush.game || { adb logcat -d -v brief -s AndroidRuntime:E; exit 1; }
            ! adb logcat -d -v brief -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'
