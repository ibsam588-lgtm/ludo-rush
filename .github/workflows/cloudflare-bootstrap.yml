name: Bootstrap Cloudflare Resources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create D1 database and queue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create D1 database
        id: d1
        shell: bash
        run: |
          set +e
          OUTPUT="$(npx wrangler d1 create ludo-rush-db 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ] && ! echo "$OUTPUT" | grep -qi "already exists"; then
            exit "$STATUS"
          fi
          DATABASE_ID="$(echo "$OUTPUT" | grep -Eo 'database_id = \"[a-f0-9-]+\"' | head -1 | sed -E 's/database_id = \"([^\"]+)\"/\\1/')"
          if [ -n "$DATABASE_ID" ]; then
            echo "database_id=$DATABASE_ID" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_D1_DATABASE_ID=$DATABASE_ID" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "D1 may already exist. Open Cloudflare D1 and copy the database id into GitHub secret CLOUDFLARE_D1_DATABASE_ID." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create Queue
        run: npx wrangler queues create ludo-rush-background || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
