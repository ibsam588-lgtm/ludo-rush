name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build and upload exactly one platform from main
        type: choice
        options: [ ios, android ]
        required: true
      production_backend:
        description: Use the live backend for public iOS installs (Sandbox stays isolated)
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select one platform from main
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.select.outputs.platform }}
      upload: ${{ steps.select.outputs.upload }}
      release: ${{ steps.select.outputs.release }}
      operation: ${{ steps.select.outputs.operation }}
      revision: ${{ steps.select.outputs.revision }}
      ref: ${{ steps.select.outputs.ref }}
      commit_sha: ${{ steps.select.outputs.commit_sha }}
      branch: ${{ steps.select.outputs.branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test main-only release selection
        run: node --test .github/scripts/main-release-route.test.cjs
      - name: Read labels of the PR merged into this main commit
        id: select
        uses: actions/github-script@v8
        env:
          RELEASE_INPUTS_JSON: ${{ toJSON(inputs) }}
        with:
          script: >-
            const select = require('./.github/scripts/main-release-route.cjs');

            await select({ github, context, core, inputs: JSON.parse(process.env.RELEASE_INPUTS_JSON || '{}'),
            defaultUpload: true });
    if: github.ref == 'refs/heads/main'
  ios:
    name: iOS only
    needs:
      - select
    if: github.ref == 'refs/heads/main' && (needs.select.outputs.platform == 'ios')
    uses: ./.github/workflows/flutter-ios-testflight.yml
    with:
      upload: ${{ needs.select.outputs.upload == 'true' }}
      production_backend: ${{ github.event_name != 'workflow_dispatch' || inputs.production_backend }}
    secrets: inherit
  android:
    name: Android only
    needs:
      - select
    if: github.ref == 'refs/heads/main' && (needs.select.outputs.platform == 'android')
    uses: ./.github/workflows/flutter-android-internal.yml
    with:
      upload: ${{ needs.select.outputs.upload == 'true' }}
    secrets: inherit
