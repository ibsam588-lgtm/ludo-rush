name: Flutter Android — Internal Testing

on:
  push:
    branches: [main]
    paths:
      - 'client-flutter/**'
      - '.github/workflows/flutter-android-internal.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-main
  cancel-in-progress: false

jobs:
  build:
    name: Build & Upload Flutter AAB
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: client-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing Android signing keystore secret. Set ANDROID_KEYSTORE_BASE64 or UNITY_ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Build release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/client-flutter/android/app/keystore.jks
          KEY_ALIAS: ${{ secrets.ANDROID_KEYALIAS_NAME || secrets.UNITY_ANDROID_KEYALIAS_NAME }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYALIAS_PASS || secrets.UNITY_ANDROID_KEYALIAS_PASS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || secrets.UNITY_ANDROID_KEYSTORE_PASS }}
        run: |
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 10000))
          BUILD_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "Building Play internal release ${BUILD_NAME} (${BUILD_NUMBER})"
          flutter build appbundle --release --build-number="${BUILD_NUMBER}" --build-name="${BUILD_NAME}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-aab
          path: client-flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload to Play Store (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ludorush.game
          releaseFiles: client-flutter/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          releaseName: "Ludo Rush internal #${{ github.run_number }}"
          status: completed

      - name: Install backend release tools
        working-directory: backend-cloudflare
        run: npm ci

      - name: Publish forced-update build
        working-directory: backend-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 10000))
          BUILD_NAME="1.0.${GITHUB_RUN_NUMBER}"
          NOW_MS=$(date +%s000)
          npx wrangler d1 migrations apply ludo-rush-db --remote
          npx wrangler d1 execute ludo-rush-db --remote --command \
            "INSERT INTO app_release_config (platform, minimum_build_number, latest_build_number, latest_version_name, force_latest, update_url, message, updated_at) VALUES ('android', ${BUILD_NUMBER}, ${BUILD_NUMBER}, '${BUILD_NAME}', 1, 'https://play.google.com/store/apps/details?id=com.ludorush.game', 'A newer version of Ludo Rush is required to keep matchmaking, rewards, and game rules in sync.', ${NOW_MS}) ON CONFLICT(platform) DO UPDATE SET minimum_build_number = excluded.minimum_build_number, latest_build_number = excluded.latest_build_number, latest_version_name = excluded.latest_version_name, force_latest = 1, update_url = excluded.update_url, message = excluded.message, updated_at = excluded.updated_at;"
