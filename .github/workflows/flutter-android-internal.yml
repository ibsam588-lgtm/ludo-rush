name: Flutter Android — Internal Testing

on:
  push:
    branches: [main]
    paths:
      - 'client-flutter/**'
      - '.github/workflows/flutter-android-internal.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload Flutter AAB
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: client-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing Android signing keystore secret. Set ANDROID_KEYSTORE_BASE64 or UNITY_ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Build release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/client-flutter/android/app/keystore.jks
          KEY_ALIAS: ${{ secrets.ANDROID_KEYALIAS_NAME || secrets.UNITY_ANDROID_KEYALIAS_NAME }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYALIAS_PASS || secrets.UNITY_ANDROID_KEYALIAS_PASS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || secrets.UNITY_ANDROID_KEYSTORE_PASS }}
        run: flutter build appbundle --release --build-number=$((GITHUB_RUN_NUMBER + 10000))

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-aab
          path: client-flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload to Play Store (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ludorush.game
          releaseFiles: client-flutter/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
