name: Android — Verify and Internal Testing

on:
  workflow_call:
    inputs:
      upload:
        description: Upload only after the selected main PR merges
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.upload }}

jobs:
  build:
    name: Build & Upload Flutter AAB
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      LEVELPLAY_FIRST_ROUND_INTERSTITIAL: 1
      LEVELPLAY_ROUND_INTERSTITIAL_INTERVAL: 1
      LEVELPLAY_SHOP_REWARD_POINTS: 300
      LEVELPLAY_LEVEL_REWARD_POINTS: 150
      LEVELPLAY_LEVEL_REWARD_ENERGY: 1
      LEVELPLAY_CHILD_DIRECTED: ${{ vars.LEVELPLAY_CHILD_DIRECTED || 'false' }}
      LEVELPLAY_TEST_SUITE: ${{ vars.LEVELPLAY_TEST_SUITE || 'false' }}
    defaults:
      run:
        working-directory: client-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test shared game
        run: flutter test --no-pub

      - name: Verify Android release on pull requests
        if: ${{ !inputs.upload }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pr-signing.jks
          KEY_ALIAS: pr-signing
          KEY_PASSWORD: android
          STORE_PASSWORD: android
        run: |
          keytool -genkeypair -keystore "$KEYSTORE_PATH" -storepass android -keypass android -alias pr-signing -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI,O=Ludo Cheer,C=US"
          flutter build apk --release
          unzip -q build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' -d "$RUNNER_TEMP/release-dex"
          grep -a -l 'WorkDatabase_Impl' "$RUNNER_TEMP"/release-dex/classes*.dex

      - name: Validate production ad secrets
        if: inputs.upload && github.ref == 'refs/heads/main'
        env:
          LEVELPLAY_ANDROID_APP_KEY: ${{ secrets.LEVELPLAY_ANDROID_APP_KEY }}
          LEVELPLAY_ANDROID_BANNER_AD_UNIT: ${{ secrets.LEVELPLAY_ANDROID_BANNER_AD_UNIT }}
          LEVELPLAY_ANDROID_INTERSTITIAL_AD_UNIT: ${{ secrets.LEVELPLAY_ANDROID_INTERSTITIAL_AD_UNIT }}
          LEVELPLAY_ANDROID_REWARDED_AD_UNIT: ${{ secrets.LEVELPLAY_ANDROID_REWARDED_AD_UNIT }}
        run: |
          missing=0
          for name in \
            LEVELPLAY_ANDROID_APP_KEY \
            LEVELPLAY_ANDROID_BANNER_AD_UNIT \
            LEVELPLAY_ANDROID_INTERSTITIAL_AD_UNIT \
            LEVELPLAY_ANDROID_REWARDED_AD_UNIT; do
            if [ -z "${!name}" ]; then
              echo "Missing required production ad secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode keystore
        if: inputs.upload && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing Android signing keystore secret. Set ANDROID_KEYSTORE_BASE64 or UNITY_ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Build release AAB
        if: inputs.upload && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/client-flutter/android/app/keystore.jks
          KEY_ALIAS: ${{ secrets.ANDROID_KEYALIAS_NAME || secrets.UNITY_ANDROID_KEYALIAS_NAME }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYALIAS_PASS || secrets.UNITY_ANDROID_KEYALIAS_PASS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || secrets.UNITY_ANDROID_KEYSTORE_PASS }}
          LEVELPLAY_ANDROID_APP_KEY: ${{ secrets.LEVELPLAY_ANDROID_APP_KEY }}
          LEVELPLAY_ANDROID_BANNER_AD_UNIT: ${{ secrets.LEVELPLAY_ANDROID_BANNER_AD_UNIT }}
          LEVELPLAY_ANDROID_INTERSTITIAL_AD_UNIT: ${{ secrets.LEVELPLAY_ANDROID_INTERSTITIAL_AD_UNIT }}
          LEVELPLAY_ANDROID_REWARDED_AD_UNIT: ${{ secrets.LEVELPLAY_ANDROID_REWARDED_AD_UNIT }}
        run: |
          BUILD_NUMBER=$((10105 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          VERSION_SEQUENCE=$((105 + GITHUB_RUN_NUMBER))
          BUILD_NAME="1.0.${VERSION_SEQUENCE}"
          echo "Building Play internal release ${BUILD_NAME} (${BUILD_NUMBER})"
          flutter build appbundle --release \
            --build-number="${BUILD_NUMBER}" \
            --build-name="${BUILD_NAME}" \
            --dart-define=LEVELPLAY_PRODUCTION=true \
            --dart-define=LEVELPLAY_CHILD_DIRECTED="$LEVELPLAY_CHILD_DIRECTED" \
            --dart-define=LEVELPLAY_TEST_SUITE="$LEVELPLAY_TEST_SUITE" \
            --dart-define=LEVELPLAY_ANDROID_APP_KEY="$LEVELPLAY_ANDROID_APP_KEY" \
            --dart-define=LEVELPLAY_ANDROID_BANNER_AD_UNIT="$LEVELPLAY_ANDROID_BANNER_AD_UNIT" \
            --dart-define=LEVELPLAY_ANDROID_INTERSTITIAL_AD_UNIT="$LEVELPLAY_ANDROID_INTERSTITIAL_AD_UNIT" \
            --dart-define=LEVELPLAY_ANDROID_REWARDED_AD_UNIT="$LEVELPLAY_ANDROID_REWARDED_AD_UNIT" \
            --dart-define=LEVELPLAY_FIRST_ROUND_INTERSTITIAL="$LEVELPLAY_FIRST_ROUND_INTERSTITIAL" \
            --dart-define=LEVELPLAY_ROUND_INTERSTITIAL_INTERVAL="$LEVELPLAY_ROUND_INTERSTITIAL_INTERVAL" \
            --dart-define=LEVELPLAY_SHOP_REWARD_POINTS="$LEVELPLAY_SHOP_REWARD_POINTS" \
            --dart-define=LEVELPLAY_LEVEL_REWARD_POINTS="$LEVELPLAY_LEVEL_REWARD_POINTS" \
            --dart-define=LEVELPLAY_LEVEL_REWARD_ENERGY="$LEVELPLAY_LEVEL_REWARD_ENERGY"

      - name: Check WorkManager startup database survives R8
        if: inputs.upload && github.ref == 'refs/heads/main'
        run: |
          unzip -q build/app/outputs/bundle/release/app-release.aab 'base/dex/classes*.dex' -d "$RUNNER_TEMP/release-dex"
          grep -a -l 'WorkDatabase_Impl' "$RUNNER_TEMP"/release-dex/base/dex/classes*.dex

      - name: Upload AAB artifact
        if: inputs.upload && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: flutter-release-aab
          path: client-flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload to Play Store (Internal)
        if: inputs.upload && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ludorush.game
          releaseFiles: client-flutter/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          releaseName: "Ludo Cheer internal #${{ github.run_number }}"
          status: completed
