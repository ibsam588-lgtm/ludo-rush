name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - backend-cloudflare/**
      - .github/workflows/backend-ci.yml
  workflow_dispatch:


permissions:
  contents: read

jobs:
  backend:
    name: Typecheck, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Workers runtime smoke test
        run: python3 test/worker-smoke.py

      - name: Audit
        run: npm audit --omit=dev --omit=optional
    if: github.ref == 'refs/heads/main'
